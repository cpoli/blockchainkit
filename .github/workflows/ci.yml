name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.16.6
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: Test (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
          cache: pip
      - run: pip install -e ".[test]"
      # 100% statement and branch coverage is enforced by pyproject.toml.
      - run: MPLBACKEND=Agg pytest -q --cov=blockchainkit --cov-branch --cov-report=term-missing
      - run: MPLBACKEND=Agg pytest --doctest-modules blockchainkit --ignore-glob="*/tests/*" -q

  package:
    name: Build and check distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: No test modules in the wheel
        run: "! unzip -l dist/*.whl | grep -q '/tests/'"
      - name: The wheel works outside the source tree, standard library only
        run: |
          python -m venv /tmp/wheel-test
          /tmp/wheel-test/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/wheel-test/bin/python -c "import sys, blockchainkit as bk; assert bk.consensus.valid_pow(bk.consensus.mine(bk.structures.Block(difficulty=4)).block); assert 'matplotlib' not in sys.modules"

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: mypy
