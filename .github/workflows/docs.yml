name: Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    # sphinx-gallery re-executes every examples/*/*/plot_*.py, and the doctest
    # build runs every line of the tutorials and exercise solutions, so these
    # are the only checks that catch a broken example, solution, or
    # ".. minigallery::" path in docs/source/history/.
    name: Build Sphinx docs (HTML and doctest)
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
      # The key covers everything an example's output can depend on, so a
      # hit means a passing build already ran this exact gallery and
      # sphinx-gallery skips every example; any change runs them all.
      - name: Restore executed gallery
        uses: actions/cache@v5
        with:
          path: |
            docs/source/api/gallery
            docs/source/gen_modules
          key: gallery-${{ hashFiles('blockchainkit/**', 'examples/**', 'docs/source/conf.py', 'pyproject.toml', '.github/workflows/docs.yml') }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[docs]"
      - run: cd docs && make html
      - run: cd docs && make doctest
      - uses: actions/upload-artifact@v7
        with:
          name: documentation
          path: docs/build/html
