[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blockchainkit"
dynamic = ["version"]
description = "Cryptography and blockchain breakthroughs, explained through reproducible Python experiments."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Charles Poli", email = "cpoli374@gmail.com"}]
maintainers = [{name = "Charles Poli", email = "cpoli374@gmail.com"}]
keywords = ["blockchain", "cryptography", "education", "simulation", "consensus"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7", "pytest-cov>=4", "hypothesis>=6"]
examples = ["matplotlib>=3.6", "numpy>=1.24"]
notebooks = ["blockchainkit[examples]", "jupyterlab>=4", "nbclient>=0.9", "nbformat>=5", "ipykernel>=6"]
docs = ["blockchainkit[examples]", "sphinx>=7", "pydata-sphinx-theme>=0.15", "sphinx-gallery>=0.17", "myst-parser>=2", "pillow>=9"]
dev = ["blockchainkit[test,docs,notebooks]", "ruff==0.16.6", "mypy>=1.10", "pre-commit>=3.7", "build>=1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "blockchainkit.__version__"}

[tool.setuptools.package-data]
blockchainkit = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["docs/source/gallery", "docs/build", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"examples/*.py" = ["E402"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/blockchainkit"]

[tool.coverage.run]
branch = true
source = ["blockchainkit"]

[tool.coverage.report]
show_missing = true
fail_under = 100
